<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Routinely</title>
    <script>
      // Apply the last-used theme and colour theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('planner.theme');
        var dark =
          t === 'DARK' ||
          (t !== 'LIGHT' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var palette = localStorage.getItem('planner.colorTheme');
        if (palette) document.documentElement.dataset.palette = palette.toLowerCase();
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
